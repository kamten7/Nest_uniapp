name: Miniapp CI

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "components/**"
      - "pages/**"
      - "store/**"
      - "utils/**"
      - "App.vue"
      - "main.js"
      - "pages.json"
      - "manifest.json"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/miniapp-ci.yml"
  pull_request:
    paths:
      - "api/**"
      - "components/**"
      - "pages/**"
      - "store/**"
      - "utils/**"
      - "App.vue"
      - "main.js"
      - "pages.json"
      - "manifest.json"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/miniapp-ci.yml"
  workflow_dispatch:

concurrency:
  group: miniapp-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build WeChat miniapp
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build mp-weixin
        run: npm run build:mp-weixin
